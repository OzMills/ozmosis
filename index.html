<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasuskonsole — Original Layout v2</title>
<style>
:root {
  color-scheme: dark;
  --bg:#05070d;
  --panel:#0d1320;
  --panel2:#121b2c;
  --text:#f2f6ff;
  --muted:#96a4bb;
  --line:#2d3a53;
  --accent:#7de3ff;
  --good:#58e39a;
  --bad:#ff6d7a;
  --warn:#f6c15c;
  --mode:#7de3ff;
  --modeSoft:rgba(125,227,255,.14);
  --modeShadow:rgba(125,227,255,.2);
  --hudHeight:104px;
  --radius:24px;
}

body[data-mode="definite"] {
  --mode:#7de3ff;
  --modeSoft:rgba(125,227,255,.14);
  --modeShadow:rgba(125,227,255,.20);
}
body[data-mode="indefinite"] {
  --mode:#b99cff;
  --modeSoft:rgba(185,156,255,.14);
  --modeShadow:rgba(185,156,255,.20);
}
body[data-mode="negative"] {
  --mode:#ff9fe0;
  --modeSoft:rgba(255,159,224,.13);
  --modeShadow:rgba(255,159,224,.18);
}

* { box-sizing:border-box; }

body {
  min-height:100vh;
  margin:0;
  padding:12px 12px calc(var(--hudHeight) + 18px);
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% -10%, var(--modeSoft), transparent 36%),
    linear-gradient(180deg,#101a2e 0%, var(--bg) 64%);
  color:var(--text);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  position:relative;
  width:min(700px,100%);
  padding:clamp(16px,4vw,28px);
  border:1px solid color-mix(in srgb, var(--mode) 42%, var(--line));
  border-radius:clamp(20px,4vw,30px);
  background:
    linear-gradient(135deg,var(--modeSoft),transparent 28%),
    linear-gradient(180deg,rgba(255,255,255,.035),transparent 24%),
    var(--panel);
  box-shadow:0 26px 80px rgba(0,0,0,.46), 0 0 50px var(--modeShadow);
  overflow:hidden;
}

main::before {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg, transparent 0 8%, var(--modeSoft) 8% 8.35%, transparent 8.35% 100%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 1px, transparent 1px 9px);
  mask-image:linear-gradient(180deg, transparent, black 10%, black 90%, transparent);
}

.header, .content { position:relative; z-index:1; }

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:clamp(12px,3vw,18px);
}

h1 {
  margin:0;
  color:var(--accent);
  font-size:clamp(1.2rem,6vw,2rem);
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:950;
}

.menuWrap { position:relative; }

#menuToggle {
  width:clamp(46px,12vw,56px);
  height:clamp(46px,12vw,56px);
  border-radius:18px;
  border:1px solid color-mix(in srgb, var(--mode) 42%, var(--line));
  background:var(--panel2);
  color:var(--text);
  font-size:1.35rem;
  cursor:pointer;
}

#settingsPanel {
  display:none;
  position:absolute;
  right:0;
  top:calc(100% + 10px);
  width:min(340px,calc(100vw - 36px));
  padding:14px;
  gap:12px;
  z-index:10;
  background:#0a101c;
  border:1px solid color-mix(in srgb, var(--mode) 40%, var(--line));
  border-radius:18px;
  box-shadow:0 18px 46px rgba(0,0,0,.46);
}
#settingsPanel.open { display:grid; }

label {
  display:grid;
  gap:7px;
  color:var(--muted);
  font-size:.78rem;
  font-weight:850;
  letter-spacing:.07em;
  text-transform:uppercase;
}

select, .menuButton {
  width:100%;
  padding:12px 13px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#070c15;
  color:var(--text);
  font:inherit;
}
.menuButton { cursor:pointer; font-weight:850; }
.menuButton.danger { color:var(--bad); }

.content {
  display:grid;
  justify-items:center;
  gap:clamp(10px,2.4vw,18px);
}

.challengeCard {
  position:relative;
  width:min(520px,100%);
  display:grid;
  gap:clamp(12px,3vw,18px);
  padding:clamp(18px,4vw,26px);
  border-radius:20px;
  border:1px solid color-mix(in srgb, var(--mode) 58%, var(--line));
  background:
    linear-gradient(135deg,var(--modeSoft),rgba(7,12,21,.76) 52%),
    rgba(7,12,21,.82);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055), 0 0 28px var(--modeShadow);
  text-align:center;
}

.modeTitle {
  color:var(--mode);
  font-size:clamp(1.1rem,4.8vw,1.55rem);
  font-weight:950;
  text-transform:uppercase;
}

.promptStack {
  display:grid;
  place-items:center;
  width:100%;
  padding:clamp(4px,1vw,8px) 0;
}

.promptWord {
  display:block;
  max-width:100%;
  color:var(--text);
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:clamp(1.45rem,4.2vw,2.65rem);
  font-weight:950;
  line-height:1.08;
  letter-spacing:-.045em;
  text-align:center;
  white-space:nowrap;
  overflow:visible;
  text-shadow:0 0 22px var(--modeShadow);
}


.answerArea {
  width:min(520px,100%);
  display:grid;
  justify-items:center;
  gap:10px;
}

#answerInput {
  width:min(420px,100%);
  padding:clamp(14px,4vw,19px);
  border-radius:20px;
  border:2px solid color-mix(in srgb, var(--mode) 48%, var(--line));
  background:#070c15;
  color:var(--text);
  text-align:center;
  font-size:clamp(1.4rem,7vw,1.95rem);
  font-weight:850;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 10px 24px rgba(0,0,0,.18);
}

#answerInput::placeholder {
  color: color-mix(in srgb, var(--muted) 72%, transparent);
  font-weight:400;
  opacity:.55;
}

#answerInput::-webkit-input-placeholder {
  color: color-mix(in srgb, var(--muted) 72%, transparent);
  font-weight:400;
  opacity:.55;
}

#answerInput:focus {
  border-color:var(--mode);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--mode) 20%, transparent), 0 0 34px var(--modeShadow);
}
#answerInput.correct { border-color:var(--good); background:rgba(88,227,154,.10); }
#answerInput.missed { border-color:var(--bad); background:rgba(255,109,122,.10); }

.actionGrid {
  width:min(420px,100%);
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:10px;
}

button {
  -webkit-tap-highlight-color: transparent;
}

#noArticleBtn, #checkBtn, #nextBtn {
  min-height:50px;
  border-radius:18px;
  padding:12px 14px;
  font:inherit;
  font-size:clamp(.9rem,3.7vw,1.05rem);
  font-weight:950;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
}

#noArticleBtn {
  border:1px solid color-mix(in srgb, var(--mode) 64%, var(--line));
  background:
    linear-gradient(180deg,rgba(255,255,255,.16),transparent),
    color-mix(in srgb, var(--mode) 58%, #07101a);
  color:#061018;
  opacity:.82;
}

#checkBtn {
  border:0;
  background:linear-gradient(180deg,rgba(255,255,255,.30),transparent), var(--mode);
  color:#041018;
}

#noArticleBtn:disabled {
  opacity:.42;
  cursor:default;
}

#nextBtn {
  display:none;
  width:min(420px,100%);
  border:0;
  background:linear-gradient(180deg,rgba(255,255,255,.24),transparent), var(--good);
  color:#041018;
}
#nextBtn.visible { display:block; }

.feedback {
  min-height:34px;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:clamp(1rem,4vw,1.2rem);
  font-weight:900;
}
.feedback.good { color:var(--good); }
.feedback.missed { color:var(--bad); }
.feedback.warn { color:var(--warn); }

.miniTableWrap {
  min-height:clamp(132px,30vw,178px);
  width:min(560px,100%);
  display:grid;
  place-items:start center;
}

.miniTable {
  width:100%;
  opacity:.92;
  border-collapse:separate;
  border-spacing:clamp(2px,1vw,4px);
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:clamp(.66rem,2.5vw,.82rem);
  opacity:0;
  transform:translateY(4px);
}
.miniTable.visible {
  opacity:.92;
  transform:translateY(0);
  transition:opacity .14s ease, transform .14s ease;
}
.miniTable th, .miniTable td {
  border:1px solid var(--line);
  background:#07101a;
  border-radius:clamp(7px,2vw,10px);
  padding:clamp(6px,1.9vw,9px) clamp(4px,1.6vw,7px);
  text-align:center;
}
.miniTable th { color:var(--muted); font-weight:950; text-transform:uppercase; }
.miniTable td { color:var(--text); font-weight:900; }
.miniTable .target { color:var(--accent-2); border-color:var(--accent-2); background:rgba(246,193,92,.08); }
.miniTable .hitCorrect { color:#041018; background:var(--good); border-color:var(--good); }
.miniTable .hitMissed { color:#12050a; background:var(--bad); border-color:var(--bad); }


.practiceSurface {
  width:min(560px,100%);
  min-height:clamp(130px,24vh,220px);
  border:1px solid color-mix(in srgb, var(--mode) 18%, var(--line));
  border-radius:20px;
  background:
    linear-gradient(135deg, var(--modeSoft), transparent 46%),
    rgba(7,12,21,.22);
  opacity:.42;
  pointer-events:none;
}

.practiceSurface.hidden {
  display:none;
}

.correctionBlock {
  display:none;
  width:min(560px,100%);
  padding:10px 12px;
  border:1px solid color-mix(in srgb, var(--bad) 24%, var(--line));
  border-left:4px solid var(--bad);
  border-radius:14px;
  background:rgba(255,109,122,.045);
  color:var(--text);
  text-align:left;
  font-size:clamp(.82rem,2.8vw,.94rem);
  line-height:1.3;
}

.correctionBlock.visible {
  display:grid;
  gap:5px;
}

.correctionTitle {
  color:var(--bad);
  font-weight:950;
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:.82em;
}

.correctionLine {
  color:var(--text);
  font-weight:780;
}

.correctionTarget {
  color:var(--text);
  font-weight:950;
}

.correctionPattern {
  color:var(--accent-2);
  font-weight:900;
}

.correctionSmall {
  color:var(--muted);
  font-weight:760;
}

.weakSummary {
  color:var(--text);
  font-weight:850;
  line-height:1.35;
}

.resultPanel {
  display:none;
  width:min(460px,100%);
  padding:16px;
  border:1px solid color-mix(in srgb, var(--mode) 42%, var(--line));
  border-radius:20px;
  background:rgba(7,12,21,.78);
  text-align:center;
}
.resultPanel.visible { display:grid; gap:10px; }
.rank { color:var(--accent-2); font-size:1.25rem; font-weight:950; text-transform:uppercase; }
.resultLine { color:var(--muted); font-weight:800; }
.bestLine { color:var(--accent); font-weight:900; }

.bottomHud {
  pointer-events:none;
  position:fixed;
  left:50%;
  bottom:max(8px, env(safe-area-inset-bottom));
  z-index:40;
  width:min(700px,calc(100vw - 16px));
  transform:translateX(-50%);
  display:grid;
  gap:8px;
  padding:10px;
  border:1px solid color-mix(in srgb, var(--mode) 42%, var(--line));
  border-radius:20px;
  background:linear-gradient(135deg,var(--modeSoft),rgba(7,12,21,.94) 48%), rgba(7,12,21,.94);
  box-shadow:0 18px 48px rgba(0,0,0,.44), 0 0 28px var(--modeShadow);
  backdrop-filter:blur(14px);
}

.progressRow {
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
}
.progressShell {
  height:9px;
  overflow:hidden;
  background:#060b13;
  border:1px solid color-mix(in srgb, var(--mode) 34%, var(--line));
  border-radius:999px;
}
#progressBar {
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--mode),var(--accent));
  border-radius:inherit;
  transition:width .18s ease;
}
#targetLabel {
  color:var(--muted);
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:.78rem;
  font-weight:950;
}

.statsGrid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
}
.stat {
  padding:7px 5px;
  background:rgba(7,12,21,.72);
  border:1px solid var(--line);
  border-radius:12px;
  text-align:center;
}
.statLabel {
  color:var(--muted);
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:clamp(.5rem,2vw,.62rem);
  font-weight:900;
  text-transform:uppercase;
}
.statValue {
  margin-top:1px;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:clamp(.82rem,3.8vw,1.05rem);
  font-weight:950;
}
.statValue.good { color:var(--good); }
.statValue.bad { color:var(--bad); }
.statValue.warn { color:var(--accent-2); }

@media (max-width:430px) {
  :root { --hudHeight:104px; }
  main { width:100%; }
  h1 { max-width:calc(100vw - 120px); }
}

@media (max-width:360px) {
  :root { --hudHeight:96px; }
  main { padding:13px; }
  h1 { font-size:1.05rem; letter-spacing:.1em; }
  #menuToggle { width:42px; height:42px; }
  .promptWord { font-size:1.45rem; }
  .actionGrid { gap:7px; }
  #noArticleBtn, #checkBtn, #nextBtn { min-height:46px; padding:10px 8px; font-size:.78rem; }
  .bottomHud { padding:8px; gap:6px; }
  .stat { padding:6px 3px; }
}

@media (orientation:landscape) and (max-height:620px) {
  body { place-items:start center; }
  main { width:min(1000px,100%); }
  .content {
    grid-template-columns:minmax(330px,1fr) minmax(300px,.9fr);
    align-items:start;
    justify-items:stretch;
  }
  .challengeCard, .answerArea { grid-column:1; width:100%; }
  .correctionBlock, .miniTableWrap, .resultPanel { grid-column:2; width:100%; max-width:none; }
  .miniTableWrap { min-height:0; }
}


/* Permanent HUD dock:
   The gamification HUD remains fixed, while the main app reserves space for it.
   The main panel can scroll internally if feedback/table content exceeds the remaining viewport.
*/
@media (min-width: 1px) {
  body {
    min-height: 100vh;
    align-content: start;
    padding-bottom: calc(var(--hudHeight) + 18px + env(safe-area-inset-bottom));
  }

  @supports (height: 100dvh) {
    body {
      min-height: 100dvh;
    }
  }

  main {
    max-height: calc(100vh - var(--hudHeight) - 34px - env(safe-area-inset-bottom));
    overflow-y: auto;
    scrollbar-gutter: stable;
  }

  @supports (height: 100dvh) {
    main {
      max-height: calc(100dvh - var(--hudHeight) - 34px - env(safe-area-inset-bottom));
    }
  }

  .bottomHud {
    position: fixed;
    left: 50%;
    bottom: max(8px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(700px, calc(100vw - 16px));
    margin: 0;
    z-index: 40;
  }
}

/* Laptop / desktop tuning:
   Keep the footer fixed, but reduce the vertical demand of the content above it.
*/
@media (min-width: 760px) {
  :root {
    --hudHeight: 96px;
  }

  body {
    padding: 18px 18px calc(var(--hudHeight) + 18px + env(safe-area-inset-bottom));
    place-items: start center;
  }

  main {
    width: min(700px, 100%);
    max-height: calc(100vh - var(--hudHeight) - 44px - env(safe-area-inset-bottom));
  }

  @supports (height: 100dvh) {
    main {
      max-height: calc(100dvh - var(--hudHeight) - 44px - env(safe-area-inset-bottom));
    }
  }

  .challengeCard {
    width: min(500px, 100%);
    padding: clamp(16px, 2.2vw, 22px);
  }

  .modeTitle {
    font-size: clamp(1rem, 2vw, 1.35rem);
  }

  .promptWord {
    font-size: clamp(1.9rem, 4vw, 2.85rem);
  }

  .practiceSurface {
    min-height: clamp(80px, 12vh, 130px);
  }

  .feedback {
    font-size: clamp(.95rem, 1.6vw, 1.1rem);
  }
}

/* Short laptop screens: compact further so the dock does not crowd the task. */
@media (min-width: 760px) and (max-height: 740px) {
  :root {
    --hudHeight: 88px;
  }

  body {
    padding-top: 12px;
    padding-bottom: calc(var(--hudHeight) + 12px + env(safe-area-inset-bottom));
  }

  main {
    padding: clamp(14px, 2vw, 20px);
    max-height: calc(100vh - var(--hudHeight) - 28px - env(safe-area-inset-bottom));
  }

  @supports (height: 100dvh) {
    main {
      max-height: calc(100dvh - var(--hudHeight) - 28px - env(safe-area-inset-bottom));
    }
  }

  .content {
    gap: 10px;
  }

  .challengeCard {
    width: min(470px, 100%);
  }

  .promptWord {
    font-size: clamp(1.7rem, 3.4vw, 2.45rem);
  }

  .practiceSurface {
    min-height: 70px;
  }

  .correctionBlock {
    font-size: .82rem;
    line-height: 1.25;
  }

  .miniTable {
    font-size: .66rem;
  }

  .bottomHud {
    padding: 8px;
    gap: 6px;
  }

  .stat {
    padding: 6px 4px;
  }
}

/* Mobile keeps the dock app-like, with enough bottom padding reserved. */
@media (max-width: 759px) {
  body {
    padding-bottom: calc(var(--hudHeight) + 18px + env(safe-area-inset-bottom));
  }

  main {
    max-height: calc(100vh - var(--hudHeight) - 28px - env(safe-area-inset-bottom));
  }

  @supports (height: 100dvh) {
    main {
      max-height: calc(100dvh - var(--hudHeight) - 28px - env(safe-area-inset-bottom));
    }
  }
}

/* Very small screens need a slightly shorter HUD and tighter main panel. */
@media (max-width: 360px) {
  main {
    max-height: calc(100vh - var(--hudHeight) - 20px - env(safe-area-inset-bottom));
  }

  @supports (height: 100dvh) {
    main {
      max-height: calc(100dvh - var(--hudHeight) - 20px - env(safe-area-inset-bottom));
    }
  }
}



/* Refinement: on laptop/landscape, right-hand support content starts at the top,
   while the answer feedback appears above Weiter instead of falling near the fold. */
@media (min-width: 760px) and (max-height: 760px) {
  .content {
    grid-template-columns: minmax(300px, .92fr) minmax(320px, 1fr);
    grid-auto-rows: auto;
    align-items: start;
    column-gap: clamp(14px, 2vw, 24px);
    row-gap: 10px;
  }

  .challengeCard {
    grid-column: 1;
    grid-row: 1;
    width: min(430px, 100%);
    padding: clamp(14px, 2vw, 18px);
  }

  .answerArea {
    grid-column: 1;
    grid-row: 2;
    width: min(430px, 100%);
  }

  .practiceSurface {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: stretch;
    min-height: 0;
    height: 100%;
  }

  .correctionBlock {
    grid-column: 2;
    grid-row: 1;
    align-self: start;
    width: 100%;
  }

  .miniTableWrap {
    grid-column: 2;
    grid-row: 2;
    align-self: start;
    width: 100%;
    min-height: 0;
  }

  .resultPanel {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: start;
    width: 100%;
  }

  .modeTitle {
    font-size: clamp(.92rem, 1.8vw, 1.18rem);
  }

  .promptStack {
    gap: clamp(10px, 2.2vw, 20px);
  }

  .promptWord {
    font-size: clamp(1.45rem, 3.3vw, 2.25rem);
  }

  #answerInput {
    padding-top: 12px;
    padding-bottom: 12px;
    font-size: clamp(1.15rem, 2.5vw, 1.55rem);
  }

  #noArticleBtn,
  #checkBtn,
  #nextBtn {
    min-height: 44px;
    padding-top: 9px;
    padding-bottom: 9px;
  }

  .feedback {
    min-height: 26px;
    font-size: clamp(.9rem, 1.5vw, 1rem);
  }

  .miniTable {
    font-size: clamp(.58rem, 1.15vw, .68rem);
  }

  .correctionBlock {
    font-size: clamp(.74rem, 1.15vw, .84rem);
    line-height: 1.22;
    padding: 9px 10px;
  }
}

/* Wider laptops with enough height still benefit from a less oversized prompt. */
@media (min-width: 900px) {
  .promptWord {
    font-size: clamp(1.65rem, 3vw, 2.55rem);
  }

  .challengeCard {
    width: min(470px, 100%);
  }
}



/* Prompt and action refinements requested:
   - Case and gender always stay side-by-side.
   - Hilfe is a text button under the answer actions.
   - Kein Artikel is visually related to Prüfen but softer.
*/
@media (max-width: 430px) {
  .promptStack {

  function renderQuestion() { renderMode(); el("resultPanel").classList.remove("visible"); var prompt=el("promptValue"); prompt.className="promptWord" + (current.kind === "cloze" ? " clozePrompt" : ""); if (current.kind === "cloze") prompt.innerHTML=sentenceHtml(current.sentence); else prompt.textContent=current.caseKey+" "+current.genderKey; renderEnglishGloss(); var input=el("answerInput"); input.value=""; input.disabled=false; input.style.display=""; input.placeholder=current.kind === "cloze" ? "Lücke ausfüllen" : "Artikel eingeben"; input.classList.remove("correct","missed"); el("feedback").innerHTML=""; el("feedback").className="feedback"; el("practiceSurface").classList.add("hidden"); el("miniTableWrap").innerHTML=""; el("correctionBlock").className="correctionBlock"; el("correctionBlock").innerHTML=""; el("actionGrid").style.display="grid"; el("checkBtn").disabled=false; el("noArticleBtn").disabled=false; el("noArticleBtn").style.display=""; el("hintBtn").disabled=false; el("hintBtn").hidden=false; el("hintBtn").style.display=""; el("nextBtn").classList.remove("visible"); el("nextBtn").textContent="Weiter"; setTimeout(function(){ input.focus(); },0); }
  function checkAnswer(overrideChoice) { if (state !== "checking") return; var input=el("answerInput"), choice=overrideChoice === "none" ? "kein artikel" : normalise(input.value); if (!choice) { el("feedback").textContent="Artikel eingeben oder „Kein Artikel“ wählen."; el("feedback").className="feedback warn"; input.focus(); return; } if (overrideChoice === "none") input.value="kein Artikel"; var valid=acceptedAnswers(current.answer).map(normalise), isCorrect=valid.indexOf(choice) !== -1; state="next"; if (isCorrect) { correct++; streak++; bestStreakRound=Math.max(bestStreakRound,streak); score += (hintUsed ? 50 : 100) + (hintUsed ? 0 : Math.min(streak,5)*10); input.classList.add("correct"); el("feedback").innerHTML=""; el("feedback").className="feedback"; renderSuccess(); renderMiniTable("correct"); } else { wrong++; streak=0; input.classList.add("missed"); el("feedback").innerHTML=""; el("feedback").className="feedback"; recordMistake(current); queueRetry(current); renderMiniTable("missed"); renderCorrection(choice); } input.disabled=true; el("checkBtn").disabled=true; el("noArticleBtn").disabled=true; el("hintBtn").disabled=true; el("hintBtn").hidden=true; el("hintBtn").hidden=true; el("hintBtn").style.display="none"; el("actionGrid").style.display="none"; renderEnglishGloss(); el("nextBtn").textContent=answeredCount() >= targetCount() ? "Ergebnis" : "Weiter"; el("nextBtn").classList.add("visible"); renderHud(); savePersistent(); el("nextBtn").focus(); }

  function renderMiniTable(mode) { var wrap=el("miniTableWrap"); wrap.innerHTML=""; if (!current || !paradigms[current.type]) return; var table=document.createElement("table"); table.className="miniTable"; var thead=document.createElement("thead"), headRow=document.createElement("tr"); headRow.appendChild(document.createElement("th")); genders.forEach(function(g){ var th=document.createElement("th"); th.textContent=g.short; headRow.appendChild(th); }); thead.appendChild(headRow); table.appendChild(thead); var tbody=document.createElement("tbody"); activeCases().forEach(function(c){ var row=document.createElement("tr"), th=document.createElement("th"); th.textContent=c.short; row.appendChild(th); genders.forEach(function(g){ var td=document.createElement("td"), value=paradigms[current.type].table[c.key+"|"+g.key], isTarget=c.key===current.caseKey && g.key===current.genderKey; if (mode === "hint" && isTarget) { td.textContent="???"; td.className="target"; } else td.textContent=displayAnswer(value); if (mode === "correct" && isTarget) td.className="hitCorrect"; if (mode === "missed" && isTarget) td.className="hitMissed"; row.appendChild(td); }); tbody.appendChild(row); }); table.appendChild(tbody); wrap.appendChild(table); setTimeout(function(){ table.classList.add("visible"); },0); }
  function rankName(acc, mistakes, finalStreak) { if (acc===100 && finalStreak>=targetCount()) return "Perfekter Lauf"; if (acc>=95) return "Kasuskommandant"; if (acc>=85) return "Formstabil"; if (acc>=70) return "Auf Kurs"; if (mistakes<=targetCount()/2) return "Wacklig, aber lebendig"; return "Reparaturmodus"; }
  function showResults() { state="results"; if (score>highScore) highScore=score; if (bestStreakRound>bestStreakAll) bestStreakAll=bestStreakRound; savePersistent(); document.body.setAttribute("data-mode","definite"); el("modeTitle").textContent="Auswertung"; el("promptValue").className="promptWord"; el("promptValue").textContent=accuracy()+"% Trefferquote"; if (el("englishGloss")) el("englishGloss").textContent=taskTitle(); el("answerInput").style.display="none"; el("actionGrid").style.display="none"; el("hintBtn").style.display="none"; el("miniTableWrap").innerHTML=""; el("correctionBlock").className="correctionBlock"; el("correctionBlock").innerHTML=""; el("feedback").innerHTML=""; el("feedback").className="feedback"; el("rankText").textContent=rankName(accuracy(),wrong,bestStreakRound); el("resultSummary").textContent=correct+" richtig · "+wrong+" Fehler · "+score+" Punkte"; el("accuracySummary").textContent="Beste Serie diese Runde: "+bestStreakRound; el("bestSummary").textContent="Bestwert: "+highScore+" Punkte · Beste Serie: "+bestStreakAll; el("weakSummary").innerHTML=weakSpotHtml(); el("resultPanel").classList.add("visible"); el("nextBtn").textContent="Neue Runde"; el("nextBtn").classList.add("visible"); renderHud(); }
  function newRound() { score=0; correct=0; wrong=0; streak=0; bestStreakRound=0; mistakeCounts={}; retryQueue=[]; state="checking"; hintUsed=false; lastKey=null; savePersistent(); pickQuestion(); }

  window.kasusCheck=function(){checkAnswer();}; window.kasusNoArticle=function(){checkAnswer("none");}; window.kasusProceed=function(){proceed();}; window.kasusHint=function(){showHint();}; window.kasusNewRound=function(){newRound();}; window.kasusResetBest=function(){ highScore=0; bestStreakAll=0; safeRemoveAll(); savePersistent(); if (state === "results") showResults(); else renderHud(); }; window.kasusToggleMenu=function(){ var panel=el("settingsPanel"); panel.classList.toggle("open"); document.body.classList.toggle("menuOpen", panel.classList.contains("open")); };
